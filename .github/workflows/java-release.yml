name: Release Java

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
  push:
    tags:
      - "v*"

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  server-id: central
                  server-username: MAVEN_USERNAME
                  server-password: MAVEN_PASSWORD
                  gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
                  gpg-passphrase: ${{ secrets.CI_GPG_PASSPHRASE }}

            - name: Extract version
              id: version
              env:
                EVENT_NAME: ${{ github.event_name }}
                INPUT_VERSION: ${{ inputs.version }}
              run: |
                if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                  echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
                else
                  echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
                fi

            - name: Set version in pom.xml
              env:
                VERSION: ${{ steps.version.outputs.VERSION }}
              run: mvn versions:set -DnewVersion="$VERSION"

            - name: Build and test
              run: mvn clean verify

            - name: Deploy to Maven Central
              run: mvn source:jar javadoc:javadoc deploy -P symphony-release -DskipTests
              env:
                  MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
                  GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}

            # maven-deploy only PUTs files; this hands the staging repo to the Central Portal (same runner IP).
            # Namespace must match https://central.sonatype.com/publishing/namespaces (often your Maven groupId).
            - name: Finalize deployment (Central Portal)
              env:
                  MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
              run: |
                TOKEN=$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)
                curl -sfS -X POST \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/org.finos.springbot?publishing_type=user_managed"